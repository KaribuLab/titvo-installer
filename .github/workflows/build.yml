name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  kli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download kli
        id: download_kli
        run: |
          curl -sL https://github.com/KaribuLab/kli/releases/download/v0.2.2/kli  --output kli
      - name: Check tag
        id: check_tag
        run: |
          chmod +x ./kli
      - name: Upload kli
        uses: actions/upload-artifact@v4
        with:
            name: kli
            path: kli
  check_tag:
    needs: kli
    runs-on: ubuntu-latest
    outputs:
      target_version: ${{ steps.check_tag.outputs.target_version }}
      tag_exists: ${{ steps.check_tag.outputs.tag_exists }}
      release_exists: ${{ steps.check_tag.outputs.release_exists }}
    steps:
    -
      name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    -
      name: Download kli
      uses: actions/download-artifact@v4
      with:
        name: kli
        path: ./
    -
      name: Check tag
      id: check_tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        chmod +x ./kli
        LATEST_VERSION=$( ./kli semver 2>&1 )
        LATEST_GIT_TAG=$( git describe --tags --abbrev=0 || echo "" )
        echo "target_version=$LATEST_VERSION"
        echo "latest_git_tag=$LATEST_GIT_TAG"
        echo "target_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
        if [ "$LATEST_VERSION" == "$LATEST_GIT_TAG" ]; then
          echo "tag_exists=true"
          echo "tag_exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "tag_exists=false"
          echo "tag_exists=false" >> "$GITHUB_OUTPUT"
        fi
        if gh release view "$LATEST_VERSION" >/dev/null 2>&1; then
          echo "release_exists=true"
          echo "release_exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "release_exists=false"
          echo "release_exists=false" >> "$GITHUB_OUTPUT"
        fi
  create_tag:
    needs: check_tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.check_tag.outputs.tag_exists == 'false'
    permissions:
      contents: write
    steps:
    -
      name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    -
      name: Set up Git user
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    -
      name: Download kli
      uses: actions/download-artifact@v4
      with:
        name: kli
        path: ./
    -
      name: Push tags if needed
      id: push_tags
      run: |
        chmod +x ./kli
        ./kli semver -t -v
  build:
    name: Build and Release Binaries
    needs: [check_tag, create_tag]
    if: |
      always() &&
      needs.check_tag.outputs.release_exists == 'false' &&
      (needs.create_tag.result == 'success' || needs.check_tag.outputs.tag_exists == 'true')
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check_tag.outputs.target_version }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Get version
        id: get_version
        run: echo "RELEASE_VERSION=${{ needs.check_tag.outputs.target_version }}" >> $GITHUB_ENV

      - name: Build for Linux
        run: |
          GOOS=linux GOARCH=amd64 go build -o ./bin/titvo-linux-amd64 ./cmd/titvo-installer
          GOOS=linux GOARCH=arm64 go build -o ./bin/titvo-linux-arm64 ./cmd/titvo-installer

      - name: Build for macOS
        run: |
          GOOS=darwin GOARCH=amd64 go build -o ./bin/titvo-darwin-amd64 ./cmd/titvo-installer
          GOOS=darwin GOARCH=arm64 go build -o ./bin/titvo-darwin-arm64 ./cmd/titvo-installer

      - name: Build for Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -o ./bin/titvo-windows-amd64.exe ./cmd/titvo-installer

      - name: Compress binaries
        run: |
          cd bin
          tar -czvf titvo-linux-amd64.tar.gz titvo-linux-amd64
          tar -czvf titvo-linux-arm64.tar.gz titvo-linux-arm64
          tar -czvf titvo-darwin-amd64.tar.gz titvo-darwin-amd64
          tar -czvf titvo-darwin-arm64.tar.gz titvo-darwin-arm64
          zip titvo-windows-amd64.zip titvo-windows-amd64.exe
          cd ..

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          files: |
            bin/titvo-linux-amd64.tar.gz
            bin/titvo-linux-arm64.tar.gz
            bin/titvo-darwin-amd64.tar.gz
            bin/titvo-darwin-arm64.tar.gz
            bin/titvo-windows-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
